services:
  - type: web
    name: 100xaltcoin
    runtime: docker
    plan: starter            # paid instance: the free tier sleeps, which stops polling
    healthCheckPath: /health
    disk:
      name: history
      mountPath: /data       # HISTORY_FILE=/data/history.json.gz (set in the Dockerfile)
      sizeGB: 1
    envVars:
      - key: CMC_API_KEY
        sync: false
      - key: PAY_TO_ADDRESS
        sync: false          # your Algorand address, opted in to USDC (ASA 31566704)
      - key: ALGORAND_NETWORK
        value: mainnet
      - key: FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: PRESET
        value: startup
      # PUBLIC_URL defaults to Render's RENDER_EXTERNAL_URL (https://<name>.onrender.com)
